<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AST Viewer — tsjs-compiler</title>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin: 0; background: #1e1e2e; color: #cdd6f4; }
  #layout { display: flex; height: 100vh; }
  #left { width: 45%; padding: 12px; border-right: 1px solid #313244; display: flex; flex-direction: column; }
  #right { flex: 1; padding: 12px; overflow: auto; }
  textarea { flex: 1; width: 100%; box-sizing: border-box; background: #11111b; color: #cdd6f4; border: 1px solid #313244; border-radius: 6px; padding: 10px; font: inherit; resize: none; }
  h1 { font-size: 16px; margin: 0 0 8px; color: #89b4fa; }
  button { background: #89b4fa; color: #11111b; border: 0; border-radius: 6px; padding: 6px 14px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 8px; }
  button:hover { background: #b4befe; }
  details { margin-left: 16px; }
  summary { cursor: pointer; color: #a6e3a1; }
  .key { color: #89b4fa; }
  .str { color: #a6e3a1; }
  .num { color: #fab387; }
  .bool { color: #f38ba8; }
  .null { color: #6c7086; }
  .leaf { color: #cdd6f4; }
  .wrap { margin-left: 4px; }
  .error { color: #f38ba8; padding: 8px; }
  .hint { color: #6c7086; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div id="layout">
  <div id="left">
    <h1>AST Viewer</h1>
    <textarea id="src" spellcheck="false" placeholder='Paste AST JSON here (e.g. from "node dist/cli.js file.js --dump-ast")...'></textarea>
    <button id="render">Render</button>
    <div class="hint">Tip: run <code>node dist/cli.js your-file.js --dump-ast</code> and paste the JSON output.</div>
  </div>
  <div id="right"><div class="hint">Rendered tree appears here.</div></div>
</div>
<script>
  const src = document.getElementById('src');
  const right = document.getElementById('right');
  const render = document.getElementById('render');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderValue(value) {
    if (value === null) return '<span class="null">null</span>';
    const t = typeof value;
    if (t === 'string') return '<span class="str">"' + escapeHtml(value) + '"</span>';
    if (t === 'number') return '<span class="num">' + value + '</span>';
    if (t === 'boolean') return '<span class="bool">' + value + '</span>';
    if (t === 'undefined') return '<span class="null">undefined</span>';
    if (Array.isArray(value)) return renderArray(value);
    if (t === 'object') return renderObject(value);
    return '<span class="leaf">' + escapeHtml(String(value)) + '</span>';
  }

  function renderArray(arr) {
    if (arr.length === 0) return '<span class="null">[]</span>';
    let html = '<details open><summary>[array] ' + arr.length + '</summary>';
    arr.forEach((item, idx) => {
      html += '<div><span class="num">' + idx + '</span>: ' + renderValue(item) + '</div>';
    });
    html += '</details>';
    return html;
  }

  function renderObject(obj) {
    const keys = Object.keys(obj);
    if (keys.length === 0) return '<span class="null">{}</span>';
    let html = '<details open><summary>{object}</summary>';
    keys.forEach((k) => {
      const v = obj[k];
      const isComplex = v !== null && typeof v === 'object';
      html += '<div><span class="key">' + escapeHtml(k) + '</span>: ' +
        (isComplex ? renderValue(v) : renderValue(v)) + '</div>';
    });
    html += '</details>';
    return html;
  }

  render.addEventListener('click', () => {
    try {
      const ast = JSON.parse(src.value);
      right.innerHTML = renderValue(ast);
    } catch (e) {
      right.innerHTML = '<div class="error">Invalid JSON: ' + escapeHtml(e.message) + '</div>';
    }
  });

  // paste JSON from location hash #json=...
  const hash = decodeURIComponent(location.hash.replace(/^#json=/, ''));
  if (hash) { src.value = hash; render.click(); }
</script>
</body>
</html>
